<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sesión 29 | Pokémon con map y filter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="sesiones.css" rel="stylesheet">
  <style>
    #pokemon-list { list-style: none; padding: 0; }
    .pokemon {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
      height: 100%;
      transition: transform .2s;
    }
    .pokemon:hover { transform: translateY(-3px); }
    .pokemon img { width: 110px; height: 110px; image-rendering: pixelated; }
    .pokemon h3 { font-size: 1.05rem; font-weight: 700; text-transform: capitalize; margin: 4px 0; }
    .pokemon .numero { display: block; color: #adb5bd; font-size: .8rem; }
  </style>
</head>
<body>

  <header class="encabezado">
    <div class="container">
      <div class="etiqueta">Sesión 29 · Actividad 1</div>
      <h1>Pokémon: map y filter</h1>
      <a href="index.html" class="small">← Volver al inicio</a>
    </div>
  </header>

  <main class="container my-5">
    <p class="text-secondary">Lista de los primeros 151 Pokémon obtenida de la PokéAPI con su nombre, imagen y peso. Escribe un nombre (o parte de él) y presiona <strong>Buscar</strong>.</p>

    <!-- Campo de búsqueda y botón -->
    <div class="input-group input-group-lg mb-3" style="max-width: 640px;">
      <input type="text" id="search-input" class="form-control" placeholder="Buscar Pokémon por nombre">
      <button id="search-button" class="btn btn-danger">Buscar</button>
    </div>
    <p id="estado" class="text-secondary">Cargando Pokémon…</p>

    <!-- Aquí se insertan los <li> creados con map -->
    <ul id="pokemon-list" class="row g-3"></ul>
  </main>

  <script src="pokemon.js"></script>
</body>
</html>
