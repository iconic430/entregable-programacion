<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sesión 20 | Formulario de contacto - Sabores de México</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="sesiones.css" rel="stylesheet">
</head>
<body>

  <header class="encabezado">
    <div class="container">
      <div class="etiqueta">Sesión 20 · Actividad 3</div>
      <h1>Personalizar un formulario de contacto</h1>
      <a href="index.html" class="small">← Volver al inicio</a>
    </div>
  </header>

  <main class="container my-5" style="max-width: 720px;">

    <div class="card actividad shadow-sm">
      <div class="card-body p-4">
        <h2 class="h4 fw-bold mb-1">Contáctanos</h2>
        <p class="text-secondary mb-4">Reservaciones, eventos privados o dudas sobre tu pedido.</p>

        <form id="formContacto" novalidate>
          <div class="mb-3">
            <label for="asunto" class="form-label">Asunto *</label>
            <input type="text" class="form-control" id="asunto" name="asunto" placeholder="Ej. Reservación para 6 personas" required>
          </div>
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre *</label>
            <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre" required>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="correo" class="form-label">Correo *</label>
              <input type="email" class="form-control" id="correo" name="correo" placeholder="tu@correo.com" required>
            </div>
            <div class="col-md-6">
              <label for="telefono" class="form-label">Teléfono</label>
              <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="55 1234 5678">
            </div>
          </div>
          <div class="mb-3">
            <label for="mensaje" class="form-label">Mensaje *</label>
            <textarea class="form-control" id="mensaje" name="mensaje" rows="4" placeholder="Cuéntanos cómo podemos ayudarte" required></textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">Enviar mensaje</button>
            <button type="reset" class="btn btn-secondary">Limpiar</button>
          </div>
        </form>

        <div class="alert alert-success mt-3 mb-0 d-none" id="enviado">
          ¡Gracias! Recibimos tu mensaje y te contestaremos pronto.
        </div>
      </div>
    </div>

  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // querySelector: el primer campo de texto cambia su fondo a bg-success.
      const primerCampo = document.querySelector('input[type="text"]');
      primerCampo.classList.add("bg-success", "text-white");

      // querySelectorAll: todos los botones se vuelven rojos con btn-danger.
      const botones = document.querySelectorAll("button");
      botones.forEach(boton => {
        boton.classList.remove("btn-success", "btn-secondary");
        boton.classList.add("btn-danger");
      });

      // getElementsByName: el campo de nombre cambia su texto a text-warning.
      const campoNombre = document.getElementsByName("nombre")[0];
      campoNombre.classList.add("text-warning", "fw-bold");

      // Validación sencilla del formulario.
      const form = document.getElementById("formContacto");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!form.checkValidity()) {
          form.classList.add("was-validated");
          return;
        }
        document.getElementById("enviado").classList.remove("d-none");
        form.reset();
        form.classList.remove("was-validated");
      });
    });
  </script>
</body>
</html>
