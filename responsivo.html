<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diseño responsivo</title>

  <!-- Bootstrap 5 (para las clases container y container-fluid) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* ---------- Diseño base: una columna ---------- */
    body {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px 0;
      min-height: 100vh;
      color: #fff;
      transition: background-color .4s;
    }

    .container,
    .container-fluid {
      background-color: rgba(255, 255, 255, .15);
      border-radius: 12px;
      padding: 20px;
    }

    .container img {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    /* Etiqueta que indica qué media query está activa */
    .indicador::after { font-weight: bold; }

    /* ---------- MEDIA QUERIES ---------- */

    /* Pantallas pequeñas (menos de 600px): de una columna a una fila, fondo gris */
    @media (max-width: 599.98px) {
      body {
        background-color: gray;
        flex-direction: row;
        padding: 10px;
        gap: 10px;
      }
      .container,
      .container-fluid {
        flex: 1;
        padding: 10px;
        font-size: .85rem;
      }
      .indicador::after { content: "Pantalla pequeña (menos de 600px): fila, fondo gris"; }
    }

    /* Pantallas medianas (600px a 900px): fondo café */
    @media (min-width: 600px) and (max-width: 899.98px) {
      body { background-color: #6f4e37; }
      .indicador::after { content: "Pantalla mediana (600px a 900px): fondo café"; }
    }

    /* Pantallas grandes (900px a 1200px): fondo morado */
    @media (min-width: 900px) and (max-width: 1199.98px) {
      body { background-color: purple; }
      .indicador::after { content: "Pantalla grande (900px a 1200px): fondo morado"; }
    }

    /* Pantallas extra grandes (más de 1200px): fondo rojo */
    @media (min-width: 1200px) {
      body { background-color: red; }
      .indicador::after { content: "Pantalla extra grande (más de 1200px): fondo rojo"; }
    }
  </style>
</head>
<body>

  <!-- 1a. div con la clase container: una imagen y un párrafo -->
  <div class="container">
    <img src="https://images.unsplash.com/photo-1613514785940-daed07799d9b?w=1200" alt="Tacos al pastor">
    <p class="mb-0">
      Este div tiene la clase <strong>container</strong>: su ancho tiene un máximo que cambia
      según el tamaño de la pantalla y queda centrado, dejando márgenes a los lados.
    </p>
  </div>

  <!-- 1b. div con la clase container-fluid: dos párrafos -->
  <div class="container-fluid">
    <p>
      Este div tiene la clase <strong>container-fluid</strong>: siempre ocupa el 100% del ancho
      de la pantalla, sin importar su tamaño.
    </p>
    <p class="mb-0 indicador">Media query activa: </p>
  </div>

</body>
</html>
